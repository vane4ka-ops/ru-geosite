name: Verify and publish GeoSite

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: geosite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  verify:
    name: Validate and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.22.12
          check-latest: false
          cache: false
      - name: Test generator
        run: |
          go vet ./...
          go test ./...
      - name: Build and validate artifact
        run: |
          mkdir -p site
          go run . -out site/custom.dat
          go run . -check site/custom.dat
          (cd site && sha256sum custom.dat > custom.dat.sha256)
          (cd site && sha256sum --check custom.dat.sha256)
          touch site/.nojekyll
      - name: Upload Pages artifact
        if: github.repository == 'vane4ka-ops/ru-geosite' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.repository == 'vane4ka-ops/ru-geosite' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, codeql]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
